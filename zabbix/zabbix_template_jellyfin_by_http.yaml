        - uuid: 884b8e81cfd4419cb4b5d7ba098f07f9
          name: 'Transcode Video Total Bitrate'
          type: DEPENDENT
          key: jellyfin.transcode.bitrate
          delay: '0'
          history: 30d
          units: bps
          description: 'Aggregate bitrate of all active transcoding video streams.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=JSON.parse(value),tot=0;for(var i=0;i<s.length;i++){var t=s[i].TranscodingInfo;if(t&&typeof t.Bitrate==="number"){tot+=t.Bitrate;}}return tot;'
          master_item:
            key: jellyfin.sessions.playing.raw
        - uuid: 9b5bd9927625437fba1f02d9b6684994
          name: 'Transcode Average Framerate'
          type: DEPENDENT
          key: jellyfin.transcode.framerate
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: fps
          description: 'Average framerate (FPS) of active video transcoding streams processed by GPU/transcoder. Returns 0 when no transcode is active.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=JSON.parse(value),tot=0,cnt=0;for(var i=0;i<s.length;i++){var t=s[i].TranscodingInfo;if(t&&typeof t.Framerate==="number"&&t.Framerate>0){tot+=t.Framerate;cnt++;}}return cnt>0?Number((tot/cnt).toFixed(1)):0;'
          master_item:
            key: jellyfin.sessions.playing.raw
        - uuid: c18ad091271b47f6ba2927274b0e1b68
          name: 'Transcode Hardware Accelerated Streams'
          type: DEPENDENT
          key: jellyfin.transcode.hardware
          delay: '0'
          history: 30d
          description: 'Number of currently active transcode sessions accelerated by GPU hardware (e.g. VA-API, QSV, NVENC).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=JSON.parse(value),cnt=0;for(var i=0;i<s.length;i++){var t=s[i].TranscodingInfo;if(t&&t.HardwareAccelerationType&&t.HardwareAccelerationType.toString().toLowerCase()!=="none"&&t.HardwareAccelerationType.toString().trim()!==""){cnt++;}}return cnt;'
          master_item:
            key: jellyfin.sessions.playing.raw
        - uuid: b0406424e5704ca7a59a7d1a801bf826
          name: 'Transcode Active Reasons'
          type: DEPENDENT
          key: jellyfin.transcode.reasons
          delay: '0'
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Summary of active transcode reasons across current sessions (e.g. ContainerNotSupported, VideoCodecNotSupported). Returns None if no transcode is active.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=JSON.parse(value),r={};for(var i=0;i<s.length;i++){var t=s[i].TranscodingInfo;if(t&&t.TranscodeReasons&&t.TranscodeReasons.length){for(var j=0;j<t.TranscodeReasons.length;j++){r[t.TranscodeReasons[j]]=true;}}}var k=Object.keys(r);return k.length>0?k.sort().join(", "):"None";'
          master_item:
            key: jellyfin.sessions.playing.raw
        - uuid: fd427372a2ac49bc9a8a28eb5fc088ac
          name: 'Transcode Software (CPU Fallback) Streams'
          type: DEPENDENT
          key: jellyfin.transcode.software
          delay: '0'
          history: 30d
          description: 'Number of currently active transcode sessions running on CPU software without GPU hardware acceleration.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=JSON.parse(value),cnt=0;for(var i=0;i<s.length;i++){if(s[i].PlayState&&s[i].PlayState.PlayMethod==="Transcode"){var t=s[i].TranscodingInfo,hw=t&&t.HardwareAccelerationType;if(!hw||hw.toString().toLowerCase()==="none"||hw.toString().trim()===""){cnt++;}}}return cnt;'
          master_item:
            key: jellyfin.sessions.playing.raw
          triggers:
            - uuid: d36d3422c0c14cf680b3574cfc3ac23d
              expression: 'min(/Jellyfin by HTTP/jellyfin.transcode.software,15m)>0'
              name: 'Jellyfin Transcode running without hardware acceleration (CPU Fallback)'
              priority: WARNING
              description: 'One or more streams are currently transcoding on CPU software instead of using GPU hardware acceleration. Check GPU driver and Jellyfin hardware acceleration settings.'
        - uuid: 98fa83b3d9a6470386b3e3fa0cb99fb3
          name: 'Sessions Video Direct Stream'
          type: DEPENDENT
          key: jellyfin.transcode.video_direct
          delay: '0'
          history: 30d
          description: 'Number of active sessions where video is direct-streamed without re-encoding (audio or container only transcoding).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'var s=JSON.parse(value),cnt=0;for(var i=0;i<s.length;i++){var t=s[i].TranscodingInfo;if(t&&t.IsVideoDirect===true){cnt++;}}return cnt;'
          master_item:
            key: jellyfin.sessions.playing.raw
        - uuid: 11f2e2de423140ef804088eaca388d51
          name: 'Server Version'
          type: DEPENDENT
          key: jellyfin.version
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Jellyfin Server Version.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.Version
          master_item:
            key: jellyfin.sysinfo.raw
          triggers:
            - uuid: 07cc66967f6b484880198f2345495878
              expression: 'last(/Jellyfin by HTTP/jellyfin.version)<>last(/Jellyfin by HTTP/jellyfin.version,#2) and length(last(/Jellyfin by HTTP/jellyfin.version))>0'
              name: 'Jellyfin version changed to {ITEM.VALUE}'
              priority: INFO
              description: 'Jellyfin version has changed.'
      macros:
